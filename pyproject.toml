[project]
name = "td-mcp"
version = "0.1.0"
description = "MCP server for debugging Python inside TouchDesigner"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
td-mcp = "td_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
